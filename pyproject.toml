[project]
name = "hospital-appointment-application"
version = "0.1.0"
description = "Hospital appointment management API"
authors = [
    {name = "Hari karthikeya ManiShankarReddy",email = "hkmsreddy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.2,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "hospital_appointment_application", from = "src"}]

[tool.pytest.ini_options]
addopts = "--cov=src/hospital_appointment_application --cov-report=term-missing --cov-fail-under=95"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.2,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "httpx (>=0.28.1,<1.0.0)"
]
